<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - AI Productivity Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

<aside class="sidebar">

    <div class="dash-logo">
        <span>✦</span> AI Productivity
    </div>

    <div class="menu-title">MAIN MENU</div>

    <nav>

        <a href="dashboard.html">
            🏠 <span>Dashboard</span>
        </a>

        <a href="tasks.html">
            📋 <span>My Tasks</span>
        </a>

        <a href="calendar.html">
            📅 <span>Calendar</span>
        </a>

        <a href="notes.html" class="active">
            📝 <span>Notes</span>
        </a>

        <a href="goals.html">
            🎯 <span>Goals</span>
        </a>

        <a href="ai-assistant.html">
            🤖 <span>AI Assistant</span>
        </a>

        <a href="analytics.html">
            📊 <span>Analytics</span>
        </a>

    </nav>

    <div class="sidebar-bottom">

        <div class="menu-title">ACCOUNT</div>

        <a href="settings.html">
            ⚙️ <span>Settings</span>
        </a>

        <a href="index.html" class="logout">
            🚪 <span>Logout</span>
        </a>

    </div>

</aside>

<main class="dashboard-main">

    <header class="dashboard-header">

        <div>
            <p class="small-text">Quick Notes 📝</p>
            <h1>My Notes</h1>
        </div>

        <button onclick="openNoteForm()">＋ Add Note</button>

    </header>


    <section class="task-section">

        <div id="notesList"></div>

    </section>

</main>


<!-- Add Note Popup -->

<div class="task-modal" id="noteModal">

    <div class="task-form">

        <div class="form-top">

            <div>
                <p class="small-text">Capture your ideas ✨</p>
                <h2>Create New Note</h2>
            </div>

            <button class="close-btn" onclick="closeNoteForm()">×</button>

        </div>


        <label>Note Title</label>

        <input
            type="text"
            id="noteTitle"
            placeholder="Give your note a title..."
        >


        <label>Your Note</label>

        <textarea
            id="noteText"
            placeholder="Write your thoughts here..."
        ></textarea>


        <div class="form-buttons">

            <button class="cancel-btn" onclick="closeNoteForm()">
                Cancel
            </button>

            <button class="save-btn" onclick="saveNote()">
                ✓ Save Note
            </button>

        </div>

    </div>

</div>


<script>

let notes = [];


function getUserId() {

    let user = JSON.parse(localStorage.getItem("user"));

    return user ? user.id : 1;

}


async function loadNotes() {

    try {

        let response = await fetch(
            "https://ai-powered-personal-productivity.onrender.com/api/notes?user_id=" + getUserId()
        );

        notes = await response.json();

        showNotes();

    } catch (error) {

        alert("Backend connection failed!");

        console.log(error);

    }

}


function showNotes() {

    let notesList = document.getElementById("notesList");

    notesList.innerHTML = "";


    if (notes.length === 0) {

        notesList.innerHTML =
            "<p>No notes available. Click ＋ Add Note to create one.</p>";

        return;

    }


    notes.forEach(function(note, index) {

        let card = document.createElement("div");

        card.className = "task-card";


        card.innerHTML = `
            <div>
                <h3>📝 ${note.title}</h3>
                <p>${note.text}</p>
            </div>

            <button onclick="deleteNote(${index})">
                🗑️
            </button>
        `;


        notesList.appendChild(card);

    });

}


/* Open Popup */

function openNoteForm() {

    document.getElementById("noteModal").style.display = "flex";

}


/* Close Popup */

function closeNoteForm() {

    document.getElementById("noteModal").style.display = "none";

}


/* Save Note */

async function saveNote() {

    let title =
        document.getElementById("noteTitle").value.trim();

    let text =
        document.getElementById("noteText").value.trim();


    if (!title) {

        alert("Please enter note title.");

        return;

    }


    if (!text) {

        alert("Please write your note.");

        return;

    }


    try {

        let response = await fetch(
            "https://ai-powered-personal-productivity.onrender.com/api/notes",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    user_id: getUserId(),
                    title: title,
                    text: text
                })
            }
        );


        let result = await response.json();


        if (response.ok) {

            closeNoteForm();

            document.getElementById("noteTitle").value = "";

            document.getElementById("noteText").value = "";

            loadNotes();

        } else {

            alert(result.message);

        }


    } catch (error) {

        alert("Backend connection failed!");

    }

}


/* Delete Note */

async function deleteNote(index) {

    let note = notes[index];


    try {

        await fetch(
            "https://ai-powered-personal-productivity.onrender.com/api/notes/" + note.id,
            {
                method: "DELETE"
            }
        );

        loadNotes();

    } catch (error) {

        alert("Backend connection failed!");

    }

}


loadNotes();

</script>

</body>
</html>
