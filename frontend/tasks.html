<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - AI Productivity Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

<aside class="sidebar">

    <div class="dash-logo">
        <span>✦</span> AI Productivity
    </div>

    <div class="menu-title">MAIN MENU</div>

    <nav>

        <a href="dashboard.html">
            🏠 <span>Dashboard</span>
        </a>

        <a href="tasks.html" class="active">
            📋 <span>My Tasks</span>
        </a>

        <a href="calendar.html">
            📅 <span>Calendar</span>
        </a>

        <a href="notes.html">
            📝 <span>Notes</span>
        </a>

        <a href="goals.html">
            🎯 <span>Goals</span>
        </a>

        <a href="ai-assistant.html">
            🤖 <span>AI Assistant</span>
        </a>

        <a href="analytics.html">
            📊 <span>Analytics</span>
        </a>

    </nav>

    <div class="sidebar-bottom">

        <div class="menu-title">ACCOUNT</div>

        <a href="settings.html">
            ⚙️ <span>Settings</span>
        </a>

        <a href="index.html" class="logout">
            🚪 <span>Logout</span>
        </a>

    </div>

</aside>


<main class="dashboard-main">

    <header class="dashboard-header">

        <div>
            <p class="small-text">Task Management 📋</p>
            <h1>My Tasks</h1>
        </div>

        <button onclick="openTaskForm()">＋ Add Task</button>

    </header>


    <div class="task-filters">

        <button onclick="showAll()">All</button>
        <button onclick="showPending()">Pending</button>
        <button onclick="showCompleted()">Completed</button>

    </div>


    <section class="task-section" id="taskList"></section>


</main>


<!-- Add Task Popup -->

<div class="task-modal" id="taskModal">

    <div class="task-form">

        <div class="form-top">
            <div>
                <p class="small-text">Stay organized ✨</p>
                <h2>Create New Task</h2>
            </div>

            <button class="close-btn" onclick="closeTaskForm()">×</button>
        </div>

        <label>Task Name</label>
        <input
            type="text"
            id="taskName"
            placeholder="What do you need to do?"
        >

        <label>Priority</label>
        <select id="taskPriority">
            <option value="High">🔴 High</option>
            <option value="Medium" selected>🟡 Medium</option>
            <option value="Low">🟢 Low</option>
        </select>

        <label>Due Date</label>
        <input
            type="date"
            id="taskDate"
        >

        <div class="form-buttons">
            <button class="cancel-btn" onclick="closeTaskForm()">
                Cancel
            </button>

            <button class="save-btn" onclick="saveTask()">
                ✓ Add Task
            </button>
        </div>

    </div>

</div>


<script>

let tasks = [];

function getUserId() {

    let user = JSON.parse(localStorage.getItem("user"));

    return user ? user.id : 1;
}


async function loadTasks() {

    try {

        let response = await fetch(
            "http://127.0.0.1:5000/api/tasks?user_id=" + getUserId()
        );

        tasks = await response.json();

        displayTasks();

    } catch (error) {

        alert("Backend connection failed!");

        console.log(error);
    }
}


function displayTasks(list = tasks) {

    let taskList = document.getElementById("taskList");

    taskList.innerHTML = "";

    list.forEach(function(task, index) {

        let card = document.createElement("div");

        card.className = "task-card";

        card.style.opacity = task.completed ? "0.5" : "1";

        card.innerHTML = `
            <input type="checkbox"
            ${task.completed ? "checked" : ""}
            onchange="completeTask(${index})">

            <div>
                <h3 style="text-decoration:${task.completed ? "line-through" : "none"}">
                    ${task.name}
                </h3>

                <p>${task.priority} Priority</p>

                <small>📅 Due: ${task.due_date || "Not set"}</small>
            </div>

            <button onclick="deleteTask(${index})">🗑️</button>
        `;

        taskList.appendChild(card);
    });
}


/* Open Popup */

function openTaskForm() {

    document.getElementById("taskModal").style.display = "flex";

}


/* Close Popup */

function closeTaskForm() {

    document.getElementById("taskModal").style.display = "none";

}


/* Save Task */

async function saveTask() {

    let name = document.getElementById("taskName").value.trim();

    let priority = document.getElementById("taskPriority").value;

    let date = document.getElementById("taskDate").value;


    if (!name) {

        alert("Please enter task name.");

        return;
    }


    if (!date) {

        date = "Not set";

    } else {

        let parts = date.split("-");

        date = parts[2] + "/" + parts[1] + "/" + parts[0];

    }


    try {

        let response = await fetch(
            "http://127.0.0.1:5000/api/tasks",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    user_id: getUserId(),
                    name: name,
                    priority: priority,
                    due_date: date
                })
            }
        );


        if (response.ok) {

            closeTaskForm();

            document.getElementById("taskName").value = "";

            document.getElementById("taskDate").value = "";

            loadTasks();

        } else {

            alert("Task could not be added.");

        }

    } catch (error) {

        alert("Backend connection failed!");

    }
}


/* Complete Task */

async function completeTask(index) {

    let task = tasks[index];

    try {

        await fetch(
            "http://127.0.0.1:5000/api/tasks/" + task.id,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    completed: !task.completed
                })
            }
        );

        loadTasks();

    } catch (error) {

        alert("Backend connection failed!");

    }
}


/* Delete Task */

async function deleteTask(index) {

    let task = tasks[index];

    try {

        await fetch(
            "http://127.0.0.1:5000/api/tasks/" + task.id,
            {
                method: "DELETE"
            }
        );

        loadTasks();

    } catch (error) {

        alert("Backend connection failed!");

    }
}


function showAll() {

    displayTasks(tasks);

}


function showPending() {

    let pending = tasks.filter(function(task) {

        return !task.completed;

    });

    displayTasks(pending);

}


function showCompleted() {

    let completed = tasks.filter(function(task) {

        return task.completed;

    });

    displayTasks(completed);

}


loadTasks();

</script>

</body>

</html>
